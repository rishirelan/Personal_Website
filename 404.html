<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found | Dr.ir. Rishi Relan</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#020617">
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #475569; --border: #e2e8f0; --accent: #0284c7; --amber: #f59e0b; }
        @media (prefers-color-scheme: dark) { :root { --bg: #020617; --card: #0f172a; --text: #f1f5f9; --muted: #94a3b8; --border: rgba(255,255,255,.08); --accent: #38bdf8; --amber: #fbbf24; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px 32px; text-align: center; }
        .code { font: 600 14px/1 ui-monospace, Consolas, monospace; letter-spacing: .2em; color: var(--accent); }
        .bar { width: 48px; height: 4px; background: var(--amber); border-radius: 2px; margin: 18px auto; }
        h1 { margin: 0 0 12px; font-size: 26px; }
        p { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        a.btn { display: inline-block; padding: 12px 20px; border-radius: 10px; font-weight: 700; text-decoration: none; }
        a.primary { background: var(--accent); color: #fff; }
        a.secondary { border: 1px solid var(--border); color: var(--text); }
        a.btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <div class="bar"></div>
        <h1>This page doesn't exist</h1>
        <p>The link may be old or mistyped. Everything about my work &mdash; talks, publications and how to invite me &mdash; is on the main page.</p>
        <div class="actions">
            <a class="btn primary" href="/">Go to rishirelan.com</a>
            <a class="btn secondary" href="/#invite">Invite me to speak</a>
        </div>
    </main>
</body>
</html>
